<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>GymNote 가상 환경</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172331;font:16px/1.6 system-ui,sans-serif}header{background:#162e46;color:white;padding:24px max(20px,calc((100vw - 1200px)/2))}header h1{margin:0;font-size:24px}header p{margin:5px 0;color:#dce9f4}.layout{max-width:1200px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:320px 1fr;gap:22px}section,aside{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #14253a0a}label{display:block;margin:12px 0 4px;font-weight:600}select,input,textarea{font:inherit;width:100%;padding:10px;border:1px solid #b4c4d2;border-radius:9px}button{font:inherit;cursor:pointer;border:1px solid #bdcbd8;background:#f5f8fb;border-radius:10px;padding:10px 14px;margin:4px}button.primary{background:#1768d1;color:white;border-color:#1768d1}button:disabled{opacity:.5;cursor:default}h2{font-size:21px;margin-top:0}h3{font-size:17px}small,.muted{color:#526879}nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px}nav button[aria-current=true]{background:#dceafd;border-color:#1768d1}article{background:#f2f6fa;border-radius:14px;padding:16px;margin:12px 0}.goal{background:#e7f1ff;padding:14px;border-radius:12px}#error{color:#a82525;min-height:28px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf2f6;padding:14px;border-radius:10px;max-height:420px;overflow:auto;font-size:13px}.badge{font-size:12px;border:1px solid #b9ccdf;padding:3px 8px;border-radius:20px}#review{margin-top:22px}.check{padding:8px;border-bottom:1px solid #d5e0ea}details{margin:14px 0}a{color:#1768d1}@media(max-width:800px){.layout{grid-template-columns:1fr}header{padding:20px}.layout{padding:0 12px}section,aside{padding:18px}}
</style>
<header><h1>GymNote 가상 환경 <span class="badge">웹 프로토타입</span></h1><p>고정 날짜 · 합성 계정 · 메모리 저장소. 실제 iOS 화면과 사용성 검증 결과는 별도입니다.</p></header>
<main class="layout"><aside><h2>가상 사용자 역할</h2><label for="persona">사용자</label><select id="persona"></select><label for="scenario">시나리오</label><select id="scenario"></select><button id="begin" class="primary">새 세션 시작</button><div id="context"></div><p class="goal" id="goal"></p><p><small>화면을 직접 조작하고 종료 후 기획자 관점에서 검토하세요. 세션을 다시 시작하면 초기 상태로 돌아갑니다.</small></p><button id="finish">종료하고 검토</button><button id="download" disabled>결과 JSON 내보내기</button><details><summary>사용자 역할 전달 자료</summary><p><small>현재 표시 상태만 포함합니다. 화면 이미지는 아니며 모델에는 자동 전달하지 않습니다.</small></p><pre id="packet"></pre></details></aside>
<div><section><nav aria-label="앱 분야" id="tabs"></nav><h2 id="screen-title"></h2><div id="screen"></div><p id="error" role="alert"></p><small id="steps"></small></section><section id="review" hidden><h2>기획자 검토</h2><p>아래 판정은 웹 가상 저장소의 동작 검사입니다. 사용자 이해도와 실제 iOS 성공 여부는 미평가입니다.</p><div id="checks"></div><label for="note">관찰 근거와 개선 제안</label><textarea id="note" rows="5" placeholder="어떤 단계에서 무엇을 관찰했는지, 개선안과 재검증 방법을 적으세요."></textarea><details><summary>조작 및 상태 근거</summary><pre id="evidence"></pre></details></section></div></main>

</script></html>
