name: TestFlight

# 유료 Apple Developer 계정 전용. 수동 실행만 한다(push로 자동 실행되지 않음).
# 기존 Build IPA(무료 서명용 IPA·AltStore 게시)는 건드리지 않는다.
# 준비 순서와 필요한 시크릿: docs/APPLE_DEVELOPER_SETUP.md
on:
  workflow_dispatch:
    inputs:
      marketing_version_prefix:
        description: "앱 버전 앞자리 (뒤에 실행 번호가 붙음, 예: 0.2 -> 0.2.7)"
        required: true
        default: "0.2"
      upload:
        description: "TestFlight에 업로드 (끄면 서명된 IPA만 artifact로 저장)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  APP_VERSION: ${{ inputs.marketing_version_prefix }}.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}
  APP_BUNDLE_ID: com.gymnote.app
  WIDGET_BUNDLE_ID: com.gymnote.app.widget
  APP_GROUP_ID: group.com.gymnote.app

jobs:
  # 시크릿이 없으면 macOS 빌드·검사를 돌리기 전에 바로 멈춘다.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Required Apple signing settings
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_APP_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROFILE_BASE64 }}
          APPLE_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD \
                      APPLE_APP_PROFILE_BASE64 APPLE_WIDGET_PROFILE_BASE64 \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::$name 이(가) 설정되지 않았습니다 (docs/APPLE_DEVELOPER_SETUP.md 6번)"
              missing=1
            fi
          done
          if ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID 형식이 10자리 영문 대문자·숫자가 아닙니다"
            missing=1
          fi
          exit $missing

  # 배포 전 필수 검사: Build IPA와 같은 check.yml 전체
  checks:
    needs: [preflight]
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  testflight:
    needs: [preflight, checks]
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install certificate and profiles
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_APP_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROFILE_BASE64 }}
          APPLE_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          KEYCHAIN_PATH="$RUNNER_TEMP/gymnote-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          mkdir -p "$SIGN_DIR" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$SIGN_DIR/dist.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGN_DIR/dist.p12" -P "$APPLE_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Apple Distribution' || true)
          if [ "$IDENTITY_COUNT" -lt 1 ]; then
            echo "::error::Apple Distribution 인증서를 찾지 못했습니다 (.p12에 개인키가 함께 들어 있는지 확인)"
            exit 1
          fi

          install_profile() {
            local b64="$1" expected_bundle="$2" out_var="$3"
            local file="$SIGN_DIR/$out_var.mobileprovision"
            printf '%s' "$b64" | base64 --decode > "$file"
            security cms -D -i "$file" > "$SIGN_DIR/$out_var.plist"
            local uuid name appid team groups
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/$out_var.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$SIGN_DIR/$out_var.plist")
            appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$SIGN_DIR/$out_var.plist")
            team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$SIGN_DIR/$out_var.plist")
            groups=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$SIGN_DIR/$out_var.plist" 2>/dev/null || true)
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$SIGN_DIR/$out_var.plist" > /dev/null 2>&1; then
              echo "::error::$name 은(는) 기기 등록형(Development/Ad Hoc) 프로파일입니다. App Store Connect 배포용으로 다시 만드세요"
              exit 1
            fi
            if [ "$team" != "$APPLE_TEAM_ID" ] || [ "$appid" != "$APPLE_TEAM_ID.$expected_bundle" ]; then
              echo "::error::$name 프로파일이 맞지 않습니다: 팀 $team / $appid (기대: $APPLE_TEAM_ID.$expected_bundle)"
              exit 1
            fi
            if ! printf '%s' "$groups" | grep -q "$APP_GROUP_ID"; then
              echo "::error::$name 프로파일에 App Group $APP_GROUP_ID 이 없습니다. App ID에서 App Groups를 켠 뒤 프로파일을 다시 만드세요"
              exit 1
            fi
            cp "$file" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "$out_var=$name" >> "$GITHUB_ENV"
            echo "프로파일 확인: $name ($appid)"
          }
          install_profile "$APPLE_APP_PROFILE_BASE64" "$APP_BUNDLE_ID" APP_PROFILE_NAME
          install_profile "$APPLE_WIDGET_PROFILE_BASE64" "$WIDGET_BUNDLE_ID" WIDGET_PROFILE_NAME
          rm -f "$SIGN_DIR/dist.p12"

      # project.yml은 그대로 두고, 서명 설정만 덧붙인 임시 spec으로 프로젝트를 만든다.
      - name: Generate signed Xcode project
        run: |
          set -euo pipefail
          cat > testflight-signing.generated.yml <<YAML
          include:
            - project.yml
          settings:
            base:
              CODE_SIGN_STYLE: Manual
              DEVELOPMENT_TEAM: "$APPLE_TEAM_ID"
          targets:
            GymNote:
              settings:
                base:
                  CODE_SIGN_IDENTITY: "Apple Distribution"
                  PROVISIONING_PROFILE_SPECIFIER: "$APP_PROFILE_NAME"
            GymNoteWidget:
              settings:
                base:
                  CODE_SIGN_IDENTITY: "Apple Distribution"
                  PROVISIONING_PROFILE_SPECIFIER: "$WIDGET_PROFILE_NAME"
          YAML
          xcodegen generate --spec testflight-signing.generated.yml
          xcodebuild -project GymNote.xcodeproj -target GymNote -configuration Release -showBuildSettings \
            | grep -E ' (PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY) = '
          xcodebuild -project GymNote.xcodeproj -target GymNoteWidget -configuration Release -showBuildSettings \
            | grep -E ' (PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY) = '

      - name: Archive
        env:
          GYMNOTE_SUPABASE_URL: ${{ vars.GYMNOTE_SUPABASE_URL }}
          GYMNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GYMNOTE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project GymNote.xcodeproj \
            -scheme GymNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GymNote.xcarchive" \
            -quiet \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            GYMNOTE_SUPABASE_URL="$GYMNOTE_SUPABASE_URL" \
            GYMNOTE_SUPABASE_PUBLISHABLE_KEY="$GYMNOTE_SUPABASE_PUBLISHABLE_KEY" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$APP_PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GymNote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"

      - name: Verify signed IPA
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/verify" && mkdir -p "$RUNNER_TEMP/verify"
          unzip -q "$RUNNER_TEMP/export/GymNote.ipa" -d "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/Payload/GymNote.app"
          for bundle in "$APP" "$APP/PlugIns/GymNoteWidget.appex"; do
            echo "--- $(basename "$bundle")"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Info.plist"
            codesign --verify --strict "$bundle"
            codesign -d --entitlements - "$bundle" 2>/dev/null | grep -q "$APP_GROUP_ID" \
              || { echo "::error::$(basename "$bundle") 서명에 App Group이 없습니다"; exit 1; }
          done

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymNote-testflight-ipa
          path: ${{ runner.temp }}/export/GymNote.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/GymNote.ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "업로드 완료: $APP_VERSION ($BUILD_NUMBER). App Store Connect > TestFlight에서 처리 완료 후 테스터에게 배포하세요."

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-$RUNNER_TEMP/gymnote-signing.keychain-db}" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing" "$HOME/.appstoreconnect/private_keys"
