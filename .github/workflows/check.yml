name: Validate GymNote
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  account-deletion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delete-account authorization checks
        run: node scripts/test_delete_account.mjs
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Model and account regression checks
        run: |
          swiftc Shared/Models.swift scripts/test_models.swift -o /tmp/model-checks
          /tmp/model-checks
          swiftc Shared/Models.swift Shared/AccountData.swift scripts/test_accounts.swift -o /tmp/account-checks
          /tmp/account-checks
          swiftc Shared/Models.swift Shared/AccountData.swift scripts/test_daily.swift -o /tmp/daily-checks
          /tmp/daily-checks
      - name: Select available iPad simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          device = next(d for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['isAvailable'] and 'iPad' in d['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('SIMULATOR_ID=' + device['udid'] + '\n')
          PY
      - name: iPad simulator build and security regression tests
        run: |
          xcodebuild -project GymNote.xcodeproj -scheme GymNote -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual test
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Authorization and concurrent backup checks
        env:
          PGPASSWORD: test-password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/auth_test_schema.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610080001_accounts.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/test_auth_policies.sql
