name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project GymNote.xcodeproj \
            -scheme GymNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # AltStore는 앱 안의 서명에서 엔타이틀먼트(App Group)를 읽어서 등록해.
      # 그래서 인증서 없이(ad-hoc) 엔타이틀먼트만 넣어서 서명해 둠. 진짜 서명은 AltStore가 함.
      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/GymNote.app"
          codesign --force --sign - --entitlements Config/GymNoteWidget.entitlements "$APP/PlugIns/GymNoteWidget.appex"
          codesign --force --sign - --entitlements Config/GymNote.entitlements "$APP"
          echo "--- widget entitlements ---"
          codesign -d --entitlements - "$APP/PlugIns/GymNoteWidget.appex"
          rm -rf Payload GymNote.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry GymNote.ipa Payload
          ls -lh GymNote.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymNote-ipa
          path: GymNote.ipa

      # 아이패드 Safari에서 바로 받을 수 있게 'latest' 릴리스에 올림
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GymNote.ipa \
            --target "${{ github.sha }}" \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "커밋 ${{ github.sha }}"
