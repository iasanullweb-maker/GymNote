# XcodeGen 설정: GitHub Actions(macOS)에서 이 파일로 Xcode 프로젝트를 만들어 빌드해.
# Mac에서 Xcode를 쓸 수 있게 되면 `xcodegen generate` 후 GymNote.xcodeproj를 열면 돼.
name: GymNote

options:
  bundleIdPrefix: com.gymnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GYMNOTE_SUPABASE_URL: ""
    GYMNOTE_SUPABASE_PUBLISHABLE_KEY: ""

targets:
  GymNote:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/App
      - path: Shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: "GymNote"
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        GYMNOTE_SUPABASE_URL: "$(GYMNOTE_SUPABASE_URL)"
        GYMNOTE_SUPABASE_PUBLISHABLE_KEY: "$(GYMNOTE_SUPABASE_PUBLISHABLE_KEY)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/GymNote.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gymnote.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymnote.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GymNoteWidget
    scheme:
      testTargets:
        - GymNoteTests

  GymNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GymNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymnote.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GymNote.app/GymNote"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GymNoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: "GymNote Widget"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/GymNoteWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gymnote.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymnote.app.widget
